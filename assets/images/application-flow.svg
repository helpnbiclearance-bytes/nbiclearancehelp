<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">NBI Clearance online application flow</title><desc id="d">Five step diagram from registration to branch visit.</desc><rect width="1200" height="520" rx="32" fill="#f7fafc"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#123b5d">NBI Clearance online application — 5 steps</text><g font-family="Arial,sans-serif"><circle cx="110" cy="185" r="43" fill="#2563eb"/><text x="110" y="197" text-anchor="middle" font-size="30" font-weight="700" fill="white">1</text><path d="M 155 185 H 285" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 273 171 l 16 14 -16 14" fill="none" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="345" cy="185" r="43" fill="#2563eb"/><text x="345" y="197" text-anchor="middle" font-size="30" font-weight="700" fill="white">2</text><path d="M 390 185 H 520" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 508 171 l 16 14 -16 14" fill="none" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="185" r="43" fill="#2563eb"/><text x="580" y="197" text-anchor="middle" font-size="30" font-weight="700" fill="white">3</text><path d="M 625 185 H 755" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 743 171 l 16 14 -16 14" fill="none" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="815" cy="185" r="43" fill="#2563eb"/><text x="815" y="197" text-anchor="middle" font-size="30" font-weight="700" fill="white">4</text><path d="M 860 185 H 990" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 978 171 l 16 14 -16 14" fill="none" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1050" cy="185" r="43" fill="#2563eb"/><text x="1050" y="197" text-anchor="middle" font-size="30" font-weight="700" fill="white">5</text><g fill="#123b5d" font-size="22" font-weight="700"><text x="110" y="275" text-anchor="middle">Register / Log in</text><text x="345" y="275" text-anchor="middle">Complete profile</text><text x="580" y="275" text-anchor="middle">Choose branch</text><text x="815" y="275" text-anchor="middle">Pay &amp; save reference</text><text x="1050" y="275" text-anchor="middle">Visit branch</text></g><g fill="#607080" font-size="17"><text x="110" y="310" text-anchor="middle">Create or access</text><text x="110" y="335" text-anchor="middle">your NBI account</text><text x="345" y="310" text-anchor="middle">Review personal</text><text x="345" y="335" text-anchor="middle">information carefully</text><text x="580" y="310" text-anchor="middle">Pick location, date</text><text x="580" y="335" text-anchor="middle">and AM/PM slot</text><text x="815" y="310" text-anchor="middle">Use supported channel</text><text x="815" y="335" text-anchor="middle">and keep the code</text><text x="1050" y="310" text-anchor="middle">Bring IDs for photo,</text><text x="1050" y="335" text-anchor="middle">fingerprints &amp; release</text></g><rect x="70" y="400" width="1060" height="70" rx="18" fill="#eaf1ff"/><text x="100" y="444" font-size="20" fill="#1d4ed8">Always complete payment and application through the official NBI system.</text></g></svg>