<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="32" fill="#F7FAFC"/><text x="60" y="66" font-family="Arial" font-size="32" font-weight="700" fill="#5f1200">What to bring to an NBI Clearance appointment</text><g font-family="Arial"><rect x="60" y="110" width="700" height="380" rx="22" fill="white" stroke="#dce6ee" stroke-width="3"/><circle cx="100" cy="170" r="17" fill="#5f1200"/><path d="M 91 170 l 7 7 13 -17" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="135" y="178" fill="#5f1200" font-size="22">Reference number or QR code</text><circle cx="100" cy="240" r="17" fill="#5f1200"/><path d="M 91 240 l 7 7 13 -17" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="135" y="248" fill="#5f1200" font-size="22">Proof of payment / receipt</text><circle cx="100" cy="310" r="17" fill="#5f1200"/><path d="M 91 310 l 7 7 13 -17" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="135" y="318" fill="#5f1200" font-size="22">Two original, unexpired government-issued IDs</text><circle cx="100" cy="380" r="17" fill="#5f1200"/><path d="M 91 380 l 7 7 13 -17" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="135" y="388" fill="#5f1200" font-size="22">Applicant-type documents, when required</text><circle cx="100" cy="450" r="17" fill="#5f1200"/><path d="M 91 450 l 7 7 13 -17" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="135" y="458" fill="#5f1200" font-size="22">Arrive at the selected branch for biometrics</text><rect x="820" y="120" width="300" height="230" rx="22" fill="#fff7ed"/><rect x="875" y="165" width="190" height="130" rx="16" fill="white" stroke="#e5d3bd" stroke-width="4"/><circle cx="925" cy="215" r="27" fill="#5f1200"/><rect x="895" y="248" width="60" height="22" rx="11" fill="#5f1200"/><rect x="975" y="195" width="60" height="12" rx="6" fill="#5f1200"/><rect x="975" y="220" width="60" height="10" rx="5" fill="#c5d2de"/><rect x="975" y="245" width="60" height="10" rx="5" fill="#c5d2de"/><rect x="820" y="380" width="300" height="110" rx="18" fill="#e7f7f4"/><text x="850" y="420" fill="#5f1200" font-size="20" font-weight="700">Use original, valid IDs</text><text x="850" y="452" fill="#45635f" font-size="16">Match names and details carefully.</text></g></svg>