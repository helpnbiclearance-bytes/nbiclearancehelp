<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="32" fill="#f7fafc"/><g font-family="Arial"><text x="60" y="68" fill="#123b5d" font-size="32" font-weight="700">Find an NBI Clearance office</text><text x="60" y="105" fill="#607080" font-size="18">Use one Philippines-wide official locator instead of relying on stale city lists.</text><rect x="60" y="155" width="700" height="80" rx="18" fill="white" stroke="#cbd8e2" stroke-width="3"/><circle cx="105" cy="195" r="15" fill="none" stroke="#607080" stroke-width="4"/><path d="M 116 206 l 17 17" stroke="#607080" stroke-width="4"/><text x="150" y="204" fill="#8796a3" font-size="20">Search the official NBI office locator</text><rect x="790" y="155" width="330" height="80" rx="18" fill="#123b5d"/><text x="955" y="205" text-anchor="middle" fill="white" font-size="20" font-weight="700">Open official locator ↗</text><rect x="60" y="285" width="1060" height="160" rx="20" fill="#eaf1ff"/><text x="100" y="340" fill="#123b5d" font-size="22" font-weight="700">Before you travel</text><text x="100" y="380" fill="#607080" font-size="18">NBI’s locator advises applicants to apply and pay online before going to a clearance office.</text><text x="100" y="415" fill="#607080" font-size="18">Office details can change, so verify the current branch information on the official map.</text></g></svg>