<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><rect width="1200" height="630" rx="32" fill="#f7fafc"/><text x="60" y="65" font-family="Arial" font-weight="700" font-size="30" fill="#123b5d">Typical online application screens</text><g font-family="Arial"><rect x="45" y="110" width="260" height="450" rx="20" fill="white" stroke="#dbe5ee" stroke-width="3"/><rect x="45" y="110" width="260" height="55" rx="20" fill="#123b5d"/><rect x="45" y="145" width="260" height="20" fill="#123b5d"/><text x="65" y="145" fill="white" font-size="18" font-weight="700">1. Sign in / Register</text><text x="65" y="200" fill="#607080" font-size="15">Use your active email and mobil</text><rect x="65" y="235" width="220" height="45" rx="8" fill="#eef3f7"/><rect x="65" y="300" width="220" height="45" rx="8" fill="#eef3f7"/><rect x="65" y="375" width="220" height="48" rx="10" fill="#2563eb"/><text x="175" y="405" fill="white" text-anchor="middle" font-size="17" font-weight="700">Log in</text><rect x="332" y="110" width="260" height="450" rx="20" fill="white" stroke="#dbe5ee" stroke-width="3"/><rect x="332" y="110" width="260" height="55" rx="20" fill="#123b5d"/><rect x="332" y="145" width="260" height="20" fill="#123b5d"/><text x="352" y="145" fill="white" font-size="18" font-weight="700">2. Applicant information</text><text x="352" y="200" fill="#607080" font-size="15">Enter details exactly as shown </text><rect x="352" y="230" width="220" height="38" rx="7" fill="#eef3f7"/><rect x="352" y="285" width="220" height="38" rx="7" fill="#eef3f7"/><rect x="352" y="340" width="220" height="38" rx="7" fill="#eef3f7"/><rect x="352" y="395" width="220" height="38" rx="7" fill="#eef3f7"/><rect x="352" y="450" width="220" height="38" rx="7" fill="#eef3f7"/><rect x="352" y="520" width="220" height="25" rx="7" fill="#2563eb"/><rect x="619" y="110" width="260" height="450" rx="20" fill="white" stroke="#dbe5ee" stroke-width="3"/><rect x="619" y="110" width="260" height="55" rx="20" fill="#123b5d"/><rect x="619" y="145" width="260" height="20" fill="#123b5d"/><text x="639" y="145" fill="white" font-size="18" font-weight="700">3. Branch &amp; schedule</text><text x="639" y="200" fill="#607080" font-size="15">Choose a convenient office and </text><rect x="639" y="230" width="220" height="42" rx="7" fill="#eef3f7"/><rect x="639" y="290" width="220" height="42" rx="7" fill="#eef3f7"/><rect x="639" y="350" width="220" height="42" rx="7" fill="#eef3f7"/><rect x="639" y="420" width="220" height="110" rx="10" fill="#f8fafc" stroke="#dbe5ee"/><g fill="#607080" font-size="13"><text x="654" y="445">Su  Mo  Tu  We  Th  Fr  Sa</text><text x="654" y="476"> 1   2   3   4   5   6   7</text><text x="654" y="505"> 8   9  10  11  12  13  14</text></g><rect x="906" y="110" width="260" height="450" rx="20" fill="white" stroke="#dbe5ee" stroke-width="3"/><rect x="906" y="110" width="260" height="55" rx="20" fill="#123b5d"/><rect x="906" y="145" width="260" height="20" fill="#123b5d"/><text x="926" y="145" fill="white" font-size="18" font-weight="700">4. Payment</text><text x="926" y="200" fill="#607080" font-size="15">Save the reference number gener</text><circle cx="944" cy="245" r="9" fill="#2563eb"/><text x="964" y="251" fill="#123b5d" font-size="15">GCash / e-wallet</text><circle cx="944" cy="307" r="9" fill="#2563eb"/><text x="964" y="313" fill="#123b5d" font-size="15">Over the counter</text><circle cx="944" cy="369" r="9" fill="#2563eb"/><text x="964" y="375" fill="#123b5d" font-size="15">Online banking</text><rect x="926" y="450" width="220" height="52" rx="10" fill="#2563eb"/><text x="1036" y="482" fill="white" text-anchor="middle" font-size="16" font-weight="700">Proceed to payment</text></g></svg>