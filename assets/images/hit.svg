<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" rx="32" fill="#f7fafc"/><g font-family="Arial"><text x="60" y="68" fill="#123b5d" font-size="32" font-weight="700">What a “HIT” means</text><text x="60" y="104" fill="#607080" font-size="18">A HIT triggers further verification. It does not by itself prove a criminal record.</text><circle cx="170" cy="235" r="50" fill="#2563eb"/><text x="170" y="247" text-anchor="middle" fill="white" font-size="32" font-weight="700">1</text><text x="170" y="320" text-anchor="middle" fill="#123b5d" font-size="22" font-weight="700">Possible match</text><text x="170" y="355" text-anchor="middle" fill="#607080" font-size="16">Name or identity details</text><path d="M 230 235 H 430" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 415 220 l 18 15 -18 15" fill="none" stroke="#9fb8cf" stroke-width="8"/><circle cx="500" cy="235" r="50" fill="#2563eb"/><text x="500" y="247" text-anchor="middle" fill="white" font-size="32" font-weight="700">2</text><text x="500" y="320" text-anchor="middle" fill="#123b5d" font-size="22" font-weight="700">Manual verification</text><text x="500" y="355" text-anchor="middle" fill="#607080" font-size="16">NBI reviewers check the record</text><path d="M 560 235 H 760" stroke="#9fb8cf" stroke-width="8" stroke-linecap="round"/><path d="M 745 220 l 18 15 -18 15" fill="none" stroke="#9fb8cf" stroke-width="8"/><circle cx="830" cy="235" r="50" fill="#2563eb"/><text x="830" y="247" text-anchor="middle" fill="white" font-size="32" font-weight="700">3</text><text x="830" y="320" text-anchor="middle" fill="#123b5d" font-size="22" font-weight="700">Release / next step</text><text x="830" y="355" text-anchor="middle" fill="#607080" font-size="16">Follow the date and instructions given</text></g></svg>