<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="32" fill="#f7fafc"/><g font-eamily="Arial"><text x="60" y="65" font-size="32" font-weight="700" fill="#123b5d">NBI Clearance fee &amp; payment</text><rect x="60" y="115" width="350" height="300" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><text x="100" y="195" fill="#0f766e" font-size="42" font-weight="700">₱130</text><text x="100" y="235" fill="#123b5d" font-size="21" font-weight="700">basic clearance fee</text><text x="100" y="275" fill="#607080" font-size="17">plus a minimal e-payment service</text><text x="100" y="302" fill="#607080" font-size="17">charge, usually around ₱25–₱30</text><rect x="455" y="115" width="685" height="300" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><text x="495" y="165" fill="#123b5d" font-size="23" font-weight="700">Payment channels named by current NBI guidance</text><rect x="495" y="210" width="170" height="62" rx="14" fill="#eef3f7"/><text x="580" y="248" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">GCash</text><rect x="700" y="210" width="170" height="62" rx="14" fill="#eef3f7"/><text x="785" y="248" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">Maya</text><rect x="905" y="210" width="170" height="62" rx="14" fill="#eef3f7"/><text x="990" y="248" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">7-Eleven</text><rect x="495" y="305" width="170" height="62" rx="14" fill="#eef3f7"/><text x="580" y="343" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">Bayad Center</text><rect x="700" y="305" width="170" height="62" rx="14" fill="#eef3f7"/><text x="785" y="343" text-anchor="middle" fill="#123b5d" font-size="18" font-weight="700">Online Banking</text><rect x="60" y="440" width="1080" height="48" rx="14" fill="#fff7e6"/><text x="90" y="471" fill="#7a4a0a" font-size="17">Confirm the final amount shown by the official NBI system before paying.</text></g></svg>