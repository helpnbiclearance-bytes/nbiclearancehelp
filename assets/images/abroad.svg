<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="32" fill="#f7fafc"/><g font-family="Arial"><text x="60" y="70" fill="#123b5d" font-size="32" font-weight="700">NBI Clearance while outside the Philippines</text><text x="60" y="108" fill="#607080" font-size="18">NBI publishes a separate mailed-clearance process for applicants abroad.</text><rect x="60" y="170" width="230" height="265" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><circle cx="175" cy="230" r="38" fill="#2563eb"/><text x="175" y="243" text-anchor="middle" fill="white" font-size="28" font-weight="700">1</text><text x="175" y="305" text-anchor="middle" fill="#123b5d" font-size="20" font-weight="700">Prepare documents</text><text x="175" y="345" text-anchor="middle" fill="#607080" font-size="15">Follow NBI overseas</text><text x="175" y="372" text-anchor="middle" fill="#607080" font-size="15">document instructions</text><rect x="330" y="170" width="230" height="265" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><circle cx="445" cy="230" r="38" fill="#2563eb"/><text x="445" y="243" text-anchor="middle" fill="white" font-size="28" font-weight="700">2</text><text x="445" y="305" text-anchor="middle" fill="#123b5d" font-size="20" font-weight="700">Fingerprints / Form</text><text x="445" y="345" text-anchor="middle" fill="#607080" font-size="15">Complete the required</text><text x="445" y="372" text-anchor="middle" fill="#607080" font-size="15">fingerprint process</text><rect x="600" y="170" width="230" height="265" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><circle cx="715" cy="230" r="38" fill="#2563eb"/><text x="715" y="243" text-anchor="middle" fill="white" font-size="28" font-weight="700">3</text><text x="715" y="305" text-anchor="middle" fill="#123b5d" font-size="20" font-weight="700">Register &amp; pay</text><text x="715" y="345" text-anchor="middle" fill="#607080" font-size="15">Representative route uses</text><text x="715" y="372" text-anchor="middle" fill="#607080" font-size="15">the official portal</text><rect x="870" y="170" width="230" height="265" rx="22" fill="white" stroke="#dbe5ee" stroke-width="3"/><circle cx="985" cy="230" r="38" fill="#2563eb"/><text x="985" y="243" text-anchor="middle" fill="white" font-size="28" font-weight="700">4</text><text x="985" y="305" text-anchor="middle" fill="#123b5d" font-size="20" font-weight="700">Mail / representative</text><text x="985" y="345" text-anchor="middle" fill="#607080" font-size="15">Send documents or use</text><text x="985" y="372" text-anchor="middle" fill="#607080" font-size="15">a designated representative</text></g></svg>